# Docker Compose configuration for Multi-Cloud Portal
# Note: Create a .env file from .env.template before running docker-compose

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Azure Configuration
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:8000/auth/callback}
      - AZURE_SHARED_IMAGE_SUBSCRIPTION_ID=${AZURE_SHARED_IMAGE_SUBSCRIPTION_ID}
      - AZURE_SHARED_IMAGE_RESOURCE_GROUP=${AZURE_SHARED_IMAGE_RESOURCE_GROUP}
      - AZURE_SHARED_IMAGE_GALLERY=${AZURE_SHARED_IMAGE_GALLERY}
      
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_SSO_INSTANCE_ARN=${AWS_SSO_INSTANCE_ARN}
      - AWS_SSO_APP_OBJECT_ID=${AWS_SSO_APP_OBJECT_ID}
      
      # GCP Configuration (Legacy Google OAuth - optional fallback)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/gcp/oauth2callback}
      
      # GCP Workload Identity Federation (Preferred for unified Azure AD SSO)
      - GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER}
      - GCP_WIF_POOL_ID=${GCP_WIF_POOL_ID:-azure-ad-pool}
      - GCP_WIF_PROVIDER_ID=${GCP_WIF_PROVIDER_ID:-azure-ad-provider}
      - GCP_SERVICE_ACCOUNT_EMAIL=${GCP_SERVICE_ACCOUNT_EMAIL}
      
      # GCP Custom Images Configuration
      - GCP_CUSTOM_IMAGE_PROJECT=${GCP_CUSTOM_IMAGE_PROJECT}
      
      # Application Configuration
      - SESSION_SECRET=${SESSION_SECRET}
      - TERRAFORM_BIN=/usr/bin/terraform
      - PORT=8000
    
    volumes:
      # Mount Terraform state directory for persistence
      - terraform-state:/app/terraform
      # Mount VM state files for persistence
      - vm-state:/app/backend
    
    restart: unless-stopped

volumes:
  terraform-state:
  vm-state:
