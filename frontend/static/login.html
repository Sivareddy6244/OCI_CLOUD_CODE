<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Multi-Cloud Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body { padding: 60px; background: #f8f9fa; }
    .login-box { max-width: 400px; margin: auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 3px 10px #ddd; }
    .btn-azure { background: #0078D4; color: #fff; }
    .btn-azure:hover { background: #005a9e; color: #fff; }
  </style>
</head>
<body>
  <div class="login-box text-center">
    <h2>Multi-Cloud Portal Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <input type="text" class="form-control" id="username" placeholder="Username" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-azure btn-lg w-100 mb-3">Login</button>
      <div id="loginError" class="text-danger mt-2"></div>
    </form>
    <small class="text-muted">Powered by Microsoft Entra ID</small>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
          window.location.href = '/'; // or your main portal page
        } else {
          const data = await res.json();
          document.getElementById('loginError').textContent = data.detail || 'Login failed';
        }
      } catch (err) {
        document.getElementById('loginError').textContent = err.message;
      }
    });
  </script>
</body>
</html>
